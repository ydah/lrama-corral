<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: http://localhost:*; object-src 'none'; base-uri 'self';">

  <!-- Primary Meta Tags -->
  <title>Lrama Corral - Visual Editor for Lrama Grammar Files</title>
  <meta name="title" content="Lrama Corral - Visual Editor for Lrama Grammar Files">
  <meta name="description" content="A browser-based visual editor for Lrama grammar files (.y). Edit, parse, validate, and visualize LALR(1) parser grammars with syntax highlighting, rule cards, and conflict detection.">
  <meta name="keywords" content="lrama, parser, grammar, yacc, bison, LALR, compiler, visual editor, ruby, wasm">
  <meta name="author" content="Lrama Corral Contributors">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ydah.github.io/lrama-corral/">
  <meta property="og:title" content="Lrama Corral - Visual Editor for Lrama Grammar Files">
  <meta property="og:description" content="A browser-based visual editor for Lrama grammar files (.y). Edit, parse, validate, and visualize LALR(1) parser grammars with syntax highlighting, rule cards, and conflict detection.">
  <meta property="og:image" content="https://ydah.github.io/lrama-corral/ogp.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://ydah.github.io/lrama-corral/">
  <meta property="twitter:title" content="Lrama Corral - Visual Editor for Lrama Grammar Files">
  <meta property="twitter:description" content="A browser-based visual editor for Lrama grammar files (.y). Edit, parse, validate, and visualize LALR(1) parser grammars with syntax highlighting, rule cards, and conflict detection.">
  <meta property="twitter:image" content="https://ydah.github.io/lrama-corral/ogp.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>Lrama Corral</h1>
        <p class="subtitle">Visual Editor for Lrama Grammar Files</p>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙 Dark Mode</button>
    </header>

    <div id="status" class="status loading">
      Initializing... Loading Ruby Wasm VM
    </div>

    <div class="content">
      <div class="editor-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label for="editor" style="margin-bottom: 0;">Lrama Grammar (.y file)</label>
          <div>
            <label for="presetSelect" style="font-size: 14px; font-weight: normal; margin-right: 8px;">Sample:</label>
            <select id="presetSelect" style="padding: 4px 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 14px;">
              <option value="">-- Select Sample --</option>
              <option value="calc">Calculator</option>
              <option value="simple">Simple</option>
              <option value="json">JSON</option>
              <option value="sql">SQL</option>
              <option value="lang">Programming Language</option>
              <option value="precedence">Precedence Demo</option>
              <option value="prologue">With Prologue</option>
            </select>
          </div>
        </div>
        <div id="editor-container"></div>
      </div>

      <div class="button-group">
        <button id="parseBtn" aria-label="Parse grammar" disabled>Parse</button>
        <button id="validateBtn" class="secondary" aria-label="Validate grammar" disabled>Validate</button>
        <button id="resetVmBtn" class="secondary" aria-label="Reset Ruby Wasm VM" disabled>Reset VM</button>
        <input type="file" id="fileInput" accept=".y,.yacc,.yy" style="display: none;">
        <button id="uploadBtn" class="secondary" aria-label="Upload grammar file" disabled>Upload File</button>
        <button id="downloadBtn" class="secondary" aria-label="Download grammar file" disabled>Download .y</button>
        <button id="exportBtn" class="secondary" aria-label="Export HTML report" disabled>Export Report</button>
        <button id="undoBtn" class="secondary" disabled title="Undo (Ctrl/Cmd+Z)" aria-label="Undo">↶ Undo</button>
        <button id="redoBtn" class="secondary" disabled title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo">↷ Redo</button>
        <label class="inline-control" for="autoParseToggle">
          <input type="checkbox" id="autoParseToggle">
          Auto Parse
        </label>
      </div>

      <div class="mobile-view-tabs" role="tablist" aria-label="Mobile workspace view">
        <button id="mobileEditorTab" type="button" role="tab" aria-selected="true">Editor</button>
        <button id="mobileOutputTab" type="button" role="tab" aria-selected="false">Analysis</button>
      </div>

      <div id="output" class="output-section"></div>
    </div>
  </div>

  <!-- Add new rule button (FAB) -->
  <button id="addRuleBtn" class="add-rule-btn" title="Add New Rule" aria-label="Add new rule" style="display: none;">+</button>

  <!-- Symbol edit modal -->
  <div id="symbolModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="symbolModalTitle" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="symbolModalTitle">Edit Symbol</h3>
        <button class="modal-close" id="symbolModalClose" aria-label="Close symbol dialog">×</button>
      </div>

      <form id="symbolForm" autocomplete="off">
        <div class="form-group">
          <label for="symbolName">Symbol Name</label>
          <input type="text" id="symbolName" placeholder="e.g., NUMBER, expr" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="symbolType">Type (optional)</label>
          <input type="text" id="symbolType" placeholder="e.g., <int>, <node>" autocomplete="off">
        </div>

        <div class="form-group" id="tokenIdGroup" style="display: none;">
          <label for="tokenId">Token ID (optional)</label>
          <input type="number" id="tokenId" placeholder="e.g., 258" autocomplete="off">
        </div>

        <div class="modal-actions">
          <button type="button" id="symbolModalCancel" class="secondary" aria-label="Cancel symbol edit">Cancel</button>
          <button type="submit" id="symbolModalSave" aria-label="Save symbol">Save Symbol</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Symbol type selection modal -->
  <div id="symbolTypeModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="symbolTypeModalTitle" aria-hidden="true">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h3 id="symbolTypeModalTitle">Register New Symbol</h3>
        <button class="modal-close" id="symbolTypeModalClose" aria-label="Close symbol type dialog">×</button>
      </div>

      <div style="margin-bottom: 20px;">
        <p style="color: var(--text-secondary); margin-bottom: 15px;">
          Symbol "<strong id="symbolTypeSymbolName" style="color: var(--btn-primary);"></strong>" is not defined.
        </p>
        <p style="color: var(--text-secondary); font-size: 14px;">
          Please choose how to register this symbol:
        </p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button id="registerAsTokenBtn" class="secondary" style="padding: 15px; font-size: 15px;" aria-label="Register symbol as token">
          📝 Register as Token
        </button>
        <button id="registerAsNonterminalBtn" class="secondary" style="padding: 15px; font-size: 15px;" aria-label="Register symbol as nonterminal">
          🔤 Register as Nonterminal
        </button>
      </div>

      <div class="modal-actions">
        <button type="button" id="symbolTypeModalCancel" class="secondary" aria-label="Cancel symbol registration">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Rule edit modal -->
  <div id="ruleModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Rule</h3>
        <button class="modal-close" id="modalClose" aria-label="Close rule dialog">×</button>
      </div>

      <form id="ruleForm" autocomplete="off">
        <div class="form-group">
          <label for="ruleLHS">Left-Hand Side (LHS)</label>
          <input type="text" id="ruleLHS" placeholder="e.g., expr" required autocomplete="off">
        </div>

        <div class="form-group">
          <label>Right-Hand Side (RHS)</label>
          <div class="symbols-list" id="rhsSymbols"></div>
          <div class="symbol-input-group">
            <input type="text" id="symbolInput" placeholder="Add symbol (e.g., term, PLUS)" autocomplete="off">
            <button type="button" id="addSymbolBtn" class="secondary" aria-label="Add RHS symbol">Add Symbol</button>
          </div>
        </div>

        <div class="form-group" id="ruleInsertPositionGroup">
          <label for="ruleInsertPosition">Insert Position</label>
          <select id="ruleInsertPosition">
            <option value="after-rules-start">After first %%</option>
            <option value="cursor">At cursor</option>
            <option value="before-epilogue">Before epilogue %%</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" id="modalCancel" class="secondary" aria-label="Cancel rule edit">Cancel</button>
          <button type="submit" id="modalSave" aria-label="Save rule">Save Rule</button>
        </div>
      </form>
    </div>
  </div>

  <div id="commandPalette" class="modal" role="dialog" aria-modal="true" aria-labelledby="commandPaletteTitle" aria-hidden="true">
    <div class="modal-content" style="max-width: 520px;">
      <div class="modal-header">
        <h3 id="commandPaletteTitle">Command Palette</h3>
        <button class="modal-close" id="commandPaletteClose" aria-label="Close command palette">×</button>
      </div>
      <input type="text" id="commandInput" placeholder="Command" autocomplete="off">
      <div id="commandList" class="command-list"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
